# xdg-desktop-portal backends for the uwc session (XDG_CURRENT_DESKTOP=uwc).
# Screen sharing and screenshots come from xdg-desktop-portal-wlr, which talks to uwc's
# wlr-screencopy / ext-image-copy-capture; everything else (file chooser, settings, ...) from GTK.
# Install the packages: xdg-desktop-portal, xdg-desktop-portal-wlr, xdg-desktop-portal-gtk.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
