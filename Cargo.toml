[package]
name = "uwc"
version = "0.1.0"
edition = "2021"
description = "uwc: a Wayland compositor with an infinite canvas and dwm-style workspaces (Rust, smithay)"
license = "MIT"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit", "backend_egl", "renderer_gl", "wayland_frontend", "desktop",
    "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev",
    "xwayland",
] }
calloop = { version = "0.14", features = ["signals"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
anyhow = "1"
xcursor = "0.3"
wayland-protocols = { version = "0.32", features = ["server", "staging", "unstable"] }
serde = { version = "1.0.229", features = ["derive"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"

[dev-dependencies]
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# smithay's debug assertions and overflow checks panic on client-controlled numbers (a layer surface's
# margins, a positioner's offsets). Release builds, which is what a session runs, do not have those checks;
# keep dev builds the same for smithay (uwc's own crate keeps them on).
#
# smithay's `use_system_lib` is off on purpose: it switches wayland-backend to libwayland, which calls every
# protocol handler through C, and a panic cannot unwind through C (the process aborts). The pure Rust
# backend dispatches in plain Rust, so `serve` in main.rs catches a panic in a handler like any other.
# (`use_system_lib` would also allow `bind_wl_display`, the legacy wl_drm path for EGL clients; uwc offers
# linux-dmabuf only, which every current Mesa and NVIDIA driver uses.)
[profile.dev.package.smithay]
debug-assertions = false
overflow-checks = false

# smithay 0.7.0 kills a client that commits a null buffer right after destroying a layer surface (the usual
# way a bar, overlay or dropdown closes): its size check runs on the state the destroy just reset. The vendored
# copy is smithay 0.7.0 plus a guard in wlr_layer/handlers.rs; drop it once smithay fixes this upstream.
[patch.crates-io]
smithay = { path = "vendor/smithay" }
