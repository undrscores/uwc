[package]
name = "uwc"
version = "0.1.0"
edition = "2021"
description = "uwc: a Wayland compositor with an infinite canvas and dwm-style workspaces (Rust, smithay)"
license = "MIT"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit", "backend_egl", "renderer_gl", "wayland_frontend", "desktop", "use_system_lib",
    "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev",
] }
calloop = { version = "0.14", features = ["signals"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
anyhow = "1"
xcursor = "0.3"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
